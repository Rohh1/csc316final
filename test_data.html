<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Democracy Data Test</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body { font-family: monospace; padding: 20px; }
        .success { color: green; }
        .error { color: red; }
        .info { color: blue; }
        pre { background: #f5f5f5; padding: 10px; }
    </style>
</head>
<body>
    <h1>Democracy Data Loading Test</h1>
    <div id="output"></div>
    
    <script>
        const output = d3.select('#output');
        
        output.append('p').html('<strong>Testing data load...</strong>');
        
        d3.csv('data/democracy_data_clean.csv').then(data => {
            output.append('p').attr('class', 'success').text('✓ CSV file loaded successfully!');
            output.append('p').text(`Total rows: ${data.length}`);
            
            // Test parsing
            data.forEach(d => {
                d.country = d.country_name;
                d.year = +d.year;
                d.spatialElectoral = +d.spatial_electoral;
                d.spatialDemocracy = +d.spatial_democracy;
            });
            
            output.append('p').attr('class', 'success').text('✓ Data parsed');
            
            // Filter valid data
            const validData = data.filter(d => 
                !isNaN(d.spatialElectoral) && 
                !isNaN(d.spatialDemocracy)
            );
            
            output.append('p').text(`Valid rows (with spatial data): ${validData.length}`);
            
            // Check 1950 data
            const data1950 = validData.filter(d => d.year === 1950);
            output.append('p').text(`1950 countries: ${data1950.length}`);
            
            // Show sample
            output.append('h3').text('Sample Data (first 5 rows of 1950):');
            const table = output.append('pre').text(
                JSON.stringify(data1950.slice(0, 5).map(d => ({
                    country: d.country,
                    year: d.year,
                    spatialElectoral: d.spatialElectoral,
                    spatialDemocracy: d.spatialDemocracy,
                    regime: d.regime_category
                })), null, 2)
            );
            
            // Check extents
            const xExtent = d3.extent(validData, d => d.spatialElectoral);
            const yExtent = d3.extent(validData, d => d.spatialDemocracy);
            
            output.append('h3').text('Data Ranges:');
            output.append('p').text(`Spatial Electoral range: ${xExtent[0]} to ${xExtent[1]}`);
            output.append('p').text(`Spatial Democracy range: ${yExtent[0]} to ${yExtent[1]}`);
            
            // Check regime categories
            const regimes = [...new Set(validData.map(d => d.regime_category))].filter(d => d).sort();
            output.append('h3').text('Regime Categories:');
            output.append('pre').text(regimes.join('\n'));
            
            output.append('p').attr('class', 'success').html('<strong>✓ All tests passed! Data should work in visualization.</strong>');
            
        }).catch(error => {
            output.append('p').attr('class', 'error').text('✗ Error loading CSV: ' + error.message);
            output.append('p').text('Make sure democracy_data_clean.csv is in the data/ folder');
        });
    </script>
</body>
</html>
